version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: advent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: "Europe/Moscow"
    volumes:
      - advent-db-data:/var/lib/postgresql/data
    networks:
      - advent-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advent_user -d advent_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  advent-bot:
    build: .
    container_name: advent-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      TZ: Europe/Moscow
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASS: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
    volumes:
      - advent-bot-db-data:/app/data
    networks:
      - advent-network

networks:
  advent-network:
    driver: bridge

volumes:
  advent-db-data:
  advent-bot-db-data:
